<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <title>Pixel Weave</title>
    <meta name="description" content="Pixel Weave is a lightweight workspace for layered pixel, ASCII, square, and shape effects with glow." />
    <link rel="preload" href="/assets/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/src/style.css" />
    <script type="module" src="/src/app.js"></script>
  </head>
  <body>
    <header class="toolbar">
      <div class="workspace-identity"><span class="wordmark">Pixel Weave</span><button id="project-name" class="project-name" type="button" aria-label="Rename project" title="Rename project"><span>Untitled</span></button></div>
      <div class="toolbar-actions">
        <select id="preset" aria-label="Layer preset" title="Layer preset"><option value="dots">Pixel</option><option value="peony">Red / lilac</option><option value="neutral">Neutral</option><option value="custom" disabled>Custom</option></select>
        <button id="load-project" title="Restore an editable project and its source image">Load project</button>
        <button id="save-project" title="Save the source image and editable layers as a .pixelweave file">Save project</button>
        <button id="export-image" class="primary" title="Download the finished image without editable layers">Export PNG</button>
      </div>
    </header>
    <main>
      <aside class="library-panel" id="library-panel" aria-label="Image and layers">
        <section class="reference-section">
          <div class="section-header"><span class="section-label">Reference</span><button id="open-image">Open image</button></div>
          <canvas id="reference-thumbnail" width="240" height="144" role="img" aria-label="Reference image"></canvas>
          <label class="range-control"><span>Image opacity <output id="source-opacity-value">55%</output></span><input id="source-opacity" aria-label="Image opacity" type="range" min="0" max="1" step="0.01" value="0.55" /></label>
          <div class="canvas-colors">
            <div class="inline-control"><label for="source-tint">Tint</label><div class="color-actions"><input type="color" id="source-tint" aria-label="Image tint" value="#ffffff" /><button id="reset-tint" class="reset-color" type="button" aria-label="Reset image tint" title="Reset image tint"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10a9 9 0 1 1 2.6 8.4M3 4v6h6"/></svg></button></div></div>
            <div class="inline-control"><label for="background">Background</label><div class="color-actions"><input type="color" id="background" aria-label="Background" value="#08090b" /><button id="reset-background" class="reset-color" type="button" aria-label="Reset background" title="Reset background"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10a9 9 0 1 1 2.6 8.4M3 4v6h6"/></svg></button></div></div>
          </div>
        </section>
        <section class="layers-section">
          <div class="section-header"><span class="section-label">Layers</span></div>
          <div class="add-actions"><button data-add="pixel">+ Pixel</button><button data-add="ascii">+ ASCII</button><button data-add="squares">+ Squares</button><button data-add="shapes">+ Shapes</button></div>
          <div id="layers" class="layer-list" aria-label="Layers, top to bottom"></div>
        </section>
      </aside>
      <section class="workspace" id="workspace" aria-label="Image preview">
        <div class="canvas-wrap" id="canvas-wrap"><div class="preview-surface" id="preview-surface"><canvas id="preview" aria-label="Rendered image"></canvas><canvas id="selection-overlay" aria-hidden="true" hidden></canvas><button id="paint-surface" class="paint-surface" type="button" aria-label="Draw selection on image. Hold left click and drag. Arrow keys move the brush; Space paints; Escape exits drawing." disabled></button><span id="brush-cursor" class="brush-cursor" aria-hidden="true"></span></div></div>
        <div class="preview-bar">
          <span id="image-name">Peony</span>
          <div class="preview-options">
            <button id="compare" aria-pressed="false" title="Toggle original image">Original</button>
            <label class="quality-label">Preview <select id="quality" aria-label="Preview resolution"><option value="768">768 px</option><option value="1280" selected>1280 px</option><option value="1920">1920 px</option></select></label>
            <output id="render-status" aria-live="off"></output>
          </div>
        </div>
        <div id="drop-overlay">Drop image</div>
      </section>
      <aside class="inspector-panel" id="inspector-panel" aria-label="Layer inspector">
        <section id="inspector" class="inspector" aria-label="Selected layer controls"></section>
      </aside>
      <div class="panel-resize panel-resize-left" data-panel-resize="left" role="separator" tabindex="0" aria-label="Resize left panel" aria-orientation="vertical" aria-controls="library-panel" title="Drag to resize. Double-click or press Enter to reset."></div>
      <div class="panel-resize panel-resize-right" data-panel-resize="right" role="separator" tabindex="0" aria-label="Resize right panel" aria-orientation="vertical" aria-controls="inspector-panel" title="Drag to resize. Double-click or press Enter to reset."></div>
    </main>
    <div id="message" role="status" hidden></div>
    <input id="image-input" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/avif,image/bmp" hidden />
    <input id="project-input" type="file" accept=".pixelweave,application/json,.json" hidden />
  </body>
</html>
