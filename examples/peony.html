<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Peony rendering benchmark</title>
<style>body{margin:0;padding:24px;background:#131316;color:#b5b5c0;font:12px system-ui}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}a{color:#d3dcff;text-decoration:none}main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}figure{margin:0;min-width:0}figcaption{margin-bottom:12px}canvas,img{display:block;width:100%;aspect-ratio:1.25;object-fit:contain;background:#000}button{border:1px solid #3c3c45;background:#23232a;color:#ddd;padding:7px 12px;border-radius:4px;cursor:pointer}#status{margin-top:16px;font-variant-numeric:tabular-nums}@media(max-width:650px){main{grid-template-columns:1fr}}</style>
<script type="module" src="./peony.js"></script></head><body>
<header><a href="/">Workspace</a><div><button id="export-source">Export source</button> <button id="export-detail">Export detail</button> <button id="export">Export result</button></div></header>
<main><figure><figcaption>Source</figcaption><canvas id="source"></canvas></figure><figure><figcaption>Target</figcaption><img src="/assets/reference-target.png" alt="User supplied red pixel and pale dot flower effect"></figure><figure><figcaption>Engine output</figcaption><canvas id="result"></canvas></figure></main>
<p id="status">Rendering</p></body></html>
